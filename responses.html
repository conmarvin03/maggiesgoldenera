<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSVP Responses · Maggie's Golden Era</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&family=Special+Elite&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <style>
        :root {
            --gold: #c9a84c;
            --bg: #ffffff;
            --bg-alt: #f8f7f4;
            --text: #1a1a1a;
            --text-muted: #777777;
            --border: #e0dcd3;
            --card-bg: #ffffff;
        }
        body.night-mode {
            --bg: #0a0a0a;
            --bg-alt: #111111;
            --text: #f0f0f0;
            --text-muted: #999999;
            --border: #2a2a2a;
            --card-bg: #1a1a1a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .top-bar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: var(--bg); border-bottom: 1px solid var(--border);
            padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }
        .top-bar a {
            text-decoration: none; color: var(--gold); font-family: 'Special Elite', cursive;
            font-size: 1.2rem;
        }
        .top-bar .title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.5rem; color: var(--text); }
        .container { max-width: 900px; margin: 0 auto; padding: 5rem 1.5rem 2rem; }
        .page-title { text-align: center; font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--text); margin-bottom: 0.5rem; }
        .page-subtitle { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; }
        .controls {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .btn-admin {
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 0.7rem 1.5rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-admin:hover {
            background: var(--gold);
            color: white;
        }
        .responses-wrap {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 8px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: var(--bg-alt); padding: 12px; text-align: left;
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--gold); border-bottom: 2px solid var(--gold);
        }
        td {
            padding: 10px; border-bottom: 1px solid var(--border); font-size: 0.9rem;
        }
        tr:last-child td { border-bottom: none; }
        td img {
            width: 50px; height: 50px; object-fit: cover; border-radius: 50%;
            border: 2px solid var(--gold);
        }
        .empty-message { text-align: center; padding: 3rem; color: var(--text-muted); font-style: italic; }
        .status-yes { color: #2e7d32; font-weight: 600; }
        .status-no { color: #c62828; font-weight: 600; }
        .status-maybe { color: #f57c00; font-weight: 600; }
        @media (max-width: 640px) {
            .top-bar { padding: 0.8rem 1rem; }
            .container { padding: 4rem 1rem 2rem; }
            th, td { padding: 8px; }
            table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body class="night-mode">
    <div class="top-bar">
        <a href="index.html">← Back to Invitation</a>
        <div class="title">RSVP Responses</div>
        <div style="width:120px;"></div>
    </div>

    <div class="container">
        <h1 class="page-title">RSVP <span style="color:var(--gold);">Responses</span></h1>
        <p class="page-subtitle">All submitted responses · for Maggie</p>
        <div class="controls">
            <button class="btn-admin" id="adminResetBtn">
                <span class="material-icons">lock</span> Admin Reset
            </button>
        </div>
        <div class="responses-wrap" id="responsesWrap">
            <p class="empty-message">No responses yet.</p>
        </div>
    </div>

    <script>
        (function() {
            // Admin password - CHANGE THIS to your preferred secret
            const ADMIN_PASSWORD = "maggie2026";

            function getSubmissions() {
                try { return JSON.parse(localStorage.getItem('rsvpSubmissions') || '[]'); } catch(e) { return []; }
            }

            function clearAllSubmissions() {
                localStorage.removeItem('rsvpSubmissions');
                // Re-render
                renderResponses();
            }

            function renderResponses() {
                const wrap = document.getElementById('responsesWrap');
                const submissions = getSubmissions();
                wrap.innerHTML = '';

                if (submissions.length === 0) {
                    wrap.innerHTML = '<p class="empty-message">No responses yet.</p>';
                    return;
                }

                const table = document.createElement('table');
                table.innerHTML = `
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nickname</th>
                            <th>Email</th>
                            <th>Attendance</th>
                            <th>Photo</th>
                        </tr>
                    </thead>
                    <tbody>
                `;

                submissions.forEach((sub, idx) => {
                    let statusHtml = '';
                    if (sub.attendance === 'yes') statusHtml = '<span class="status-yes">✅ I\'ll be there</span>';
                    else if (sub.attendance === 'no') statusHtml = '<span class="status-no">❌ Can\'t make it</span>';
                    else statusHtml = '<span class="status-maybe">🤔 I\'ll try to go</span>';

                    const photoHtml = sub.photo ?
                        `<img src="${sub.photo}" alt="${sub.nickname}" />` :
                        '<span style="color:var(--text-muted);">No photo</span>';

                    table.innerHTML += `
                        <tr>
                            <td>${idx + 1}</td>
                            <td><strong>${escapeHtml(sub.nickname)}</strong></td>
                            <td>${escapeHtml(sub.email)}</td>
                            <td>${statusHtml}</td>
                            <td>${photoHtml}</td>
                        </tr>
                    `;
                });

                table.innerHTML += '</tbody>';
                wrap.appendChild(table);
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.appendChild(document.createTextNode(str));
                return div.innerHTML;
            }

            // Admin reset button handler
            document.getElementById('adminResetBtn').addEventListener('click', function() {
                const entered = prompt("Enter admin password to clear all responses:");
                if (entered === null) return; // cancelled

                if (entered === ADMIN_PASSWORD) {
                    if (confirm("Are you sure you want to delete ALL responses? This cannot be undone.")) {
                        clearAllSubmissions();
                        alert("All responses have been cleared.");
                    }
                } else {
                    alert("Incorrect password. Access denied.");
                }
            });

            // Initial render
            renderResponses();
        })();
    </script>
</body>
</html>
