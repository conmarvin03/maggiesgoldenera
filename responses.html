<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSVP Responses · Maggie's Golden Era</title>
    <link rel="preconnect" href="https://twyzbqyuogdbukmyyztu.supabase.co" />
    <link rel="dns-prefetch" href="https://twyzbqyuogdbukmyyztu.supabase.co" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&family=Special+Elite&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --gold: #c9a84c;
            --gold-dark: #a6842c;
            --bg: #ffffff;
            --bg-alt: #f8f7f4;
            --text: #1a1a1a;
            --text-muted: #777777;
            --border: #e0dcd3;
            --card-bg: #ffffff;
        }
        body.night-mode {
            --bg: #0a0a0a;
            --bg-alt: #111111;
            --text: #f0f0f0;
            --text-muted: #999999;
            --border: #2a2a2a;
            --card-bg: #1a1a1a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .top-bar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: var(--bg); border-bottom: 1px solid var(--border);
            padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }
        .top-bar a {
            text-decoration: none; color: var(--gold); font-family: 'Special Elite', cursive;
            font-size: 1.2rem;
        }
        .top-bar .title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.5rem; color: var(--text); }
        .container { max-width: 1000px; margin: 0 auto; padding: 5rem 1.5rem 2rem; }
        .page-title { text-align: center; font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--text); margin-bottom: 0.5rem; }
        .page-subtitle { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.2rem 1rem;
            text-align: center;
            transition: all 0.3s;
        }
        .stat-card:hover {
            border-color: var(--gold);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(201,168,76,.15);
        }
        .stat-card .stat-number {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--gold);
            font-weight: 700;
            line-height: 1;
        }
        .stat-card .stat-label {
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 0.4rem;
        }
        .controls {
            text-align: center;
            margin-bottom: 1.5rem;
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-admin {
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 0.7rem 1.5rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-admin:hover {
            background: var(--gold);
            color: white;
        }
        .btn-refresh {
            border-color: var(--border);
            color: var(--text-muted);
        }
        .btn-refresh:hover {
            background: var(--gold);
            color: white;
            border-color: var(--gold);
        }
        .responses-wrap {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 8px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: var(--bg-alt); padding: 12px; text-align: left;
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--gold); border-bottom: 2px solid var(--gold);
        }
        td {
            padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 0.9rem;
            vertical-align: middle;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: var(--bg-alt); }
        td img {
            width: 55px; height: 55px; object-fit: cover; border-radius: 50%;
            border: 2px solid var(--gold);
            cursor: pointer;
            transition: transform 0.2s;
        }
        td img:hover { transform: scale(1.15); }
        .photo-placeholder {
            width: 55px; height: 55px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 2px dashed var(--border);
            color: var(--text-muted); font-size: 1.2rem;
        }
        .empty-message { text-align: center; padding: 3rem; color: var(--text-muted); font-style: italic; }
        .loading-message { text-align: center; padding: 3rem; color: var(--gold); font-family: 'Special Elite', cursive; }
        .status-yes { color: #2e7d32; font-weight: 600; }
        .status-no { color: #c62828; font-weight: 600; }
        .status-maybe { color: #f57c00; font-weight: 600; }
        .timestamp { font-size: 0.8rem; color: var(--text-muted); }
        /* Photo modal */
        .photo-modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.88);
            display: flex; align-items: center; justify-content: center;
            z-index: 3000;
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s;
            padding: 1.5rem;
        }
        .photo-modal.active { opacity: 1; visibility: visible; }
        .photo-modal img {
            max-width: 100%; max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .photo-modal-close {
            position: absolute; top: 20px; right: 25px;
            background: none; border: none; color: white;
            font-size: 2.5rem; cursor: pointer; line-height: 1;
        }
        @media (max-width: 640px) {
            .top-bar { padding: 0.8rem 1rem; }
            .top-bar .title { font-size: 1.1rem; }
            .top-bar a { font-size: 1rem; }
            .container { padding: 4rem 1rem 2rem; }
            .page-title { font-size: 1.8rem; }
            th, td { padding: 8px 6px; font-size: 0.82rem; }
            th:nth-child(4), td:nth-child(4) { display: none; }
            table { display: block; overflow-x: auto; }
            td img, .photo-placeholder { width: 42px; height: 42px; }
        }
    </style>
</head>
<body class="night-mode">
    <div class="top-bar">
        <a href="index.html">← Back to Invitation</a>
        <div class="title">RSVP Responses</div>
        <div style="width:120px;"></div>
    </div>

    <div class="container">
        <h1 class="page-title">RSVP <span style="color:var(--gold);">Responses</span></h1>
        <p class="page-subtitle">All submitted responses · for Maggie</p>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-number" id="statTotal">—</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statYes">—</div>
                <div class="stat-label">Attending</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statNo">—</div>
                <div class="stat-label">Can't Make It</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statPhotos">—</div>
                <div class="stat-label">With Photos</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-admin btn-refresh" id="refreshBtn">
                <span class="material-icons">refresh</span> Refresh
            </button>
        </div>

        <div class="responses-wrap" id="responsesWrap">
            <p class="loading-message">Loading responses...</p>
        </div>
    </div>

    <!-- Photo modal -->
    <div class="photo-modal" id="photoModal">
        <button class="photo-modal-close" id="closePhotoModal">×</button>
        <img src="" id="modalPhoto" alt="Guest photo" />
    </div>

    <script>
        (function () {
            'use strict';

            // ===== SUPABASE CONFIG =====
            const SUPABASE_URL = "https://twyzbqyuogdbukmyyztu.supabase.co";
            const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3eXpicXl1b2dkYnVrbXl5enR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzAzMzMsImV4cCI6MjEwNDU0NjMzM30.3EiQPHKQt7g3zWvpdbAcbjL4V5zjd82lRLEo4x7ERs4";
            let client = null;

            function getClient() {
                if (!client && window.supabase) {
                    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                }
                return client;
            }

            // ===== FETCH RESPONSES =====
            async function fetchResponses() {
                const c = getClient();
                if (!c) return null;
                const { data, error } = await c
                    .from('rsvp')
                    .select('nickname, attendance, photo, created_at')
                    .order('created_at', { ascending: true });
                if (error) {
                    console.warn("Fetch error:", error);
                    return null;
                }
                return data || [];
            }

            // ===== RENDER =====
            async function renderResponses() {
                const wrap = document.getElementById('responsesWrap');
                wrap.innerHTML = '<p class="loading-message">Loading responses...</p>';

                const submissions = await fetchResponses();

                if (submissions === null) {
                    wrap.innerHTML = '<p class="empty-message">Could not load responses. Please check your connection and try again.</p>';
                    return;
                }

                if (submissions.length === 0) {
                    wrap.innerHTML = '<p class="empty-message">No responses yet.</p>';
                    updateStats(0, 0, 0, 0);
                    return;
                }

                // Stats
                const total = submissions.length;
                const yes = submissions.filter(s => s.attendance === 'yes').length;
                const no = submissions.filter(s => s.attendance === 'no').length;
                const withPhotos = submissions.filter(s => s.photo).length;
                updateStats(total, yes, no, withPhotos);

                // Build table
                const table = document.createElement('table');
                let html = `
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nickname</th>
                            <th>Attendance</th>
                            <th>When</th>
                            <th>Photo</th>
                        </tr>
                    </thead>
                    <tbody>
                `;

                submissions.forEach((sub, idx) => {
                    let statusHtml = '';
                    if (sub.attendance === 'yes') statusHtml = '<span class="status-yes">✅ I\'ll be there</span>';
                    else if (sub.attendance === 'no') statusHtml = '<span class="status-no">❌ Can\'t make it</span>';
                    else statusHtml = '<span class="status-maybe">🤔 Maybe</span>';

                    let timeHtml = '<span class="timestamp">—</span>';
                    if (sub.created_at) {
                        try {
                            const d = new Date(sub.created_at);
                            timeHtml = `<span class="timestamp">${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>`;
                        } catch (e) {}
                    }

                    let photoHtml = '<div class="photo-placeholder">📷</div>';
                    if (sub.photo) {
                        photoHtml = `<img src="${sub.photo}" alt="${escapeHtml(sub.nickname)}" data-full="${sub.photo}" />`;
                    }

                    html += `
                        <tr>
                            <td>${idx + 1}</td>
                            <td><strong>${escapeHtml(sub.nickname || 'Guest')}</strong></td>
                            <td>${statusHtml}</td>
                            <td>${timeHtml}</td>
                            <td>${photoHtml}</td>
                        </tr>
                    `;
                });

                html += '</tbody>';
                table.innerHTML = html;
                wrap.innerHTML = '';
                wrap.appendChild(table);

                // Attach photo click handlers
                wrap.querySelectorAll('td img').forEach(img => {
                    img.addEventListener('click', () => {
                        document.getElementById('modalPhoto').src = img.dataset.full;
                        document.getElementById('photoModal').classList.add('active');
                    });
                });
            }

            function updateStats(total, yes, no, photos) {
                document.getElementById('statTotal').textContent = total;
                document.getElementById('statYes').textContent = yes;
                document.getElementById('statNo').textContent = no;
                document.getElementById('statPhotos').textContent = photos;
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.appendChild(document.createTextNode(str == null ? '' : str));
                return div.innerHTML;
            }

            // ===== PHOTO MODAL =====
            const photoModal = document.getElementById('photoModal');
            document.getElementById('closePhotoModal').addEventListener('click', () => {
                photoModal.classList.remove('active');
            });
            photoModal.addEventListener('click', (e) => {
                if (e.target === photoModal) photoModal.classList.remove('active');
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') photoModal.classList.remove('active');
            });

            // ===== REFRESH =====
            document.getElementById('refreshBtn').addEventListener('click', renderResponses);

            // ===== INIT (wait for Supabase SDK to load) =====
            function init() {
                if (window.supabase) {
                    renderResponses();
                } else {
                    setTimeout(init, 100);
                }
            }
            init();

        })();
    </script>
</body>
</html>
